stages:
  - lint_and_sast
  - test
  - build_and_push
  - sca
  - release
  - deploy_check
  - trigger_deploy

variables:
  DEPLOY_ENV:
    value: staging
    description: "Deployment environment (staging or production)"
    options:
      - staging
      - production
  IMAGE_TAG:
    value: "${CI_COMMIT_TAG:-$CI_COMMIT_SHA}"

lint:
  stage: lint_and_sast
  tags:
    - docker-runner
  image: nixos/nix@sha256:a83a3149cdc8196e168097d386c5133a174cf42a4fe658b397e1f4d500ad8f00
  needs: []
  script:
    - nix-shell -p ruff --run "ruff check . --output-format junit --output-file ruff_results.xml"
    - nix-shell -p hadolint --run "hadolint Dockerfile --format json > hadolint_results.json"
  artifacts:
    when: always
    paths:
      - ruff_results.xml
      - hadolint_results.json
    expire_in: 30 days
    reports:
      junit: ruff_results.xml
  rules:
    - when: always

sast:
  stage: lint_and_sast
  tags:
    - docker-runner
  needs: []
  image: python:3.12-alpine@sha256:1d132f2d802114876d114b0918e01998bf0c07af8332f776c3c4cb8e388c9a5f
  variables:
    PIP_NO_CACHE_DIR: "1"
  script:
    - pip install bandit bandit-sarif-formatter
    - bandit -r . -f sarif -o bandit-results.sarif || true
  artifacts:
    when: always
    paths:
      - bandit-results.sarif
    reports:
      sast: bandit-results.sarif
  rules:
    - when: always

build_dev:
  stage: test
  tags:
    - docker-runner
  needs:
    - lint
    - sast
  image:
    name: gcr.io/kaniko-project/executor:debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(echo -n $DOCKER_LOGIN:$DOCKER_PASSWORD | base64 -w 0)\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile Dockerfile
      --target development
      --destination $DOCKER_LOGIN/client_server_app:development-${IMAGE_TAG}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        IMAGE_TAG: $CI_COMMIT_SHA
    - if: '$CI_COMMIT_BRANCH == "master"'
      variables:
        IMAGE_TAG: $CI_COMMIT_SHA
    - if: '$CI_COMMIT_TAG =~ /^v/'
      variables:
        IMAGE_TAG: $CI_COMMIT_TAG

unit_tests:
  stage: test
  needs:
    - build_dev
  tags:
    - docker-runner
  image: $DOCKER_LOGIN/client_server_app:development-$IMAGE_TAG
  script: python -m pytest -v tests/test_unit.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        IMAGE_TAG: $CI_COMMIT_SHA
    - if: '$CI_COMMIT_BRANCH == "master"'
      variables:
        IMAGE_TAG: $CI_COMMIT_SHA
    - if: '$CI_COMMIT_TAG =~ /^v/'
      variables:
        IMAGE_TAG: $CI_COMMIT_TAG

integration_tests:
  stage: test
  needs:
    - build_dev
  tags:
    - docker-runner
  image: $DOCKER_LOGIN/client_server_app:development-$IMAGE_TAG
  script: python -m pytest -v tests/test_integration.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        IMAGE_TAG: $CI_COMMIT_SHA
    - if: '$CI_COMMIT_BRANCH == "master"'
      variables:
        IMAGE_TAG: $CI_COMMIT_SHA
    - if: '$CI_COMMIT_TAG =~ /^v/'
      variables:
        IMAGE_TAG: $CI_COMMIT_TAG

build_and_push:
  stage: build_and_push
  needs:
    - unit_tests
    - integration_tests
  tags:
    - docker-runner
  image:
    name: gcr.io/kaniko-project/executor:debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(echo -n $DOCKER_LOGIN:$DOCKER_PASSWORD | base64 -w 0)\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile Dockerfile
      --target production
      --destination $DOCKER_LOGIN/client_server_app:production-$IMAGE_TAG
      --destination $DOCKER_LOGIN/client_server_app:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
          IMAGE_TAG: $CI_COMMIT_SHA
    - if: '$CI_COMMIT_BRANCH == "master"'
      variables:
          IMAGE_TAG: $CI_COMMIT_SHA
    - if: '$CI_COMMIT_TAG =~ /^v/'
      variables:
          IMAGE_TAG: $CI_COMMIT_TAG

sca:
  stage: sca
  needs:
    - build_and_push
  tags:
    - docker-runner
  image:
    name: aquasec/trivy:0.69.3@sha256:7228e304ae0f610a1fad937baa463598cadac0c2ac4027cc68f3a8b997115689
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: "/tmp/trivy_cache"
  script: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format sarif --output trivy_results.sarif $DOCKER_LOGIN/client_server_app:production-$IMAGE_TAG
  artifacts:
    when: always
    paths:
      - trivy_results.sarif
    expire_in: 30 days
    reports:
      sast: trivy_results.sarif
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
          IMAGE_TAG: $CI_COMMIT_SHA
    - if: '$CI_COMMIT_BRANCH == "master"'
      variables:
          IMAGE_TAG: $CI_COMMIT_SHA
    - if: '$CI_COMMIT_TAG =~ /^v/'
      variables:
          IMAGE_TAG: $CI_COMMIT_TAG

release:
  stage: release
  needs:
    - sca
  tags:
    - docker-runner
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  variables:
    GIT_DEPTH: 0
  script:
    - git fetch --tags
    - PREVIOUS_TAG=$(git describe --tags --abbrev=0 $CI_COMMIT_TAG^ 2>/dev/null || echo "")
    - |
      if [ -n "$PREVIOUS_TAG" ]; then
        echo "## Changes since $PREVIOUS_TAG" > release_notes.md
        git log --pretty=format:"* %s (%h)" ${PREVIOUS_TAG}..${CI_COMMIT_TAG} >> release_notes.md
      else
        echo "## Initial release" > release_notes.md
        git log --pretty=format:"* %s (%h)" >> release_notes.md
      fi
    - cat release_notes.md
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: './release_notes.md'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'

smoke_test:
  stage: deploy_check
  needs:
    - build_and_push
  tags:
    - docker-runner
  image: curlimages/curl@sha256:eb411f0a02b75f2c2342dbc2f6579905979dd65f61f1b3047067829bb553d149
  variables:
    FF_NETWORK_PER_BUILD: "true"
  before_script:
    - echo $CA_CERT_BASE64 | base64 -d > /tmp/rootCA.pem
  script:
    - sleep 150
    - 'curl -sf --cacert /tmp/rootCA.pem --resolve cbr-app.local:443:10.184.0.117 https://cbr-app.local/info | grep "\"service\":\"${SERVICE}\"" || exit 1'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        IMAGE_TAG: $CI_COMMIT_SHA
    - if: '$CI_COMMIT_BRANCH == "master"'
      variables:
        IMAGE_TAG: $CI_COMMIT_SHA
    - if: '$CI_COMMIT_TAG =~ /^v/'
      variables:
        IMAGE_TAG: $CI_COMMIT_TAG

dast_zap:
  stage: deploy_check
  needs:
    - smoke_test
  image:
    name: zaproxy/zap-stable@sha256:c0c1477512485fd1a39bf50f6085ca951073036e7506a38dfb5ac414053dbd8e
    entrypoint: [""]
  tags:
    - docker-runner
  before_script:
    - echo $CA_CERT_BASE64 | base64 -d > /tmp/rootCA.pem
    - echo "10.184.0.117 cbr-app.local" >> /etc/hosts || true
  script:
    - mkdir -p /zap/wrk && chmod 777 /zap/wrk
    - zap-api-scan.py -t "https://cbr-app.local/openapi.json" -f openapi -J zap_report.json -I
    - cp /zap/wrk/zap_report.json ${CI_PROJECT_DIR}/zap_report.json
  artifacts:
    when: always
    paths:
      - zap_report.json
    expire_in: 30 days
    reports:
      dast: zap_report.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        IMAGE_TAG: $CI_COMMIT_SHA
    - if: '$CI_COMMIT_BRANCH == "master"'
      variables:
        IMAGE_TAG: $CI_COMMIT_SHA
    - if: '$CI_COMMIT_TAG =~ /^v/'
      variables:
        IMAGE_TAG: $CI_COMMIT_TAG
