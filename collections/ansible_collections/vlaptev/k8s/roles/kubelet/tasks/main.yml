---
- name: Add k8s user
  ansible.builtin.user:
    name: "{{ k8s_user }}"
    state: present
    create_home: true

- name: Add k8s key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/k8s-apt-keyring.asc
    mode: '0644'

- name: Add k8s repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/k8s-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /"
    state: present

- name: Install kubelet
  ansible.builtin.apt:
    name: kubelet
    state: present
    update_cache: yes

- name: Hold kubelet
  ansible.builtin.dpkg_selections:
    name: kubelet
    selection: hold