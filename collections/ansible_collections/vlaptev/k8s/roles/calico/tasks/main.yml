---
- name: Apply Calico manifest
  ansible.builtin.command:
    cmd: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v{{ calico_version }}/manifests/calico.yaml
  become: true
  become_user: "{{ k8s_user }}"
  changed_when: true

- name: Wait for Calico pods to be ready
  ansible.builtin.command:
    cmd: kubectl wait --for=condition=ready pod -l k8s-app=calico-node -n kube-system --timeout=120s
  become: true
  become_user: "{{ k8s_user }}"
  changed_when: false
