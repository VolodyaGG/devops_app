image:
  repository: "docker.io/volodyagg/client_server_app"
  tag: "latest"
service:
  port: 80
  targetPort: 8000
ingress:
  host: "cbr-app.local"
  tlsSecret: "cbr-app-tls"
replicaCount: 4
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"

affinity:
  enabled: true