---
- name: Prepare all nodes
  hosts: all
  become: true
  roles:
    - vlaptev.k8s.preps
    - vlaptev.k8s.crio
    - vlaptev.k8s.k8s_base

- name: Initialize master
  hosts: masters
  become: true
  roles:
    - vlaptev.k8s.k8s_master

- name: Join workers
  hosts: workers
  become: true
  roles:
    - vlaptev.k8s.k8s_worker

- name: Initialize calico
  hosts: masters
  become: true
  roles:
    - vlaptev.k8s.calico